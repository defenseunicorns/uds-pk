flavors:
  - name: upstream
    version: 1.2.0
  - version: non-semver
packages:
  - name: api
    path: packages/api
    flavors:
      - name: upstream
        version: 2.0.0-uds.1
      - version: 2.0.0
    charts:
      - path: charts/api
        versionFromFlavor: true
  - name: api-worker
    path: packages/api-worker
    flavors:
      - version: 3.0.0
bundles:
  - name: platform
    path: bundles/platform
    version: 4.0.0
  - name: platform-test
    path: bundles/platform-test
    version: testing
